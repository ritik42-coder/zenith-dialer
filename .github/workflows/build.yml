name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack
        run: |
          unzip -o zenith-dialer.zip -d app
          if [ -f SITE_URL.txt ]; then cp SITE_URL.txt app/SITE_URL.txt; fi
      - name: Build
        working-directory: app
        run: |
          node native/config.js
          npm install
          npx cap add android
          bash native/apply.sh
          npx cap sync android
          cd android
          chmod +x gradlew
          ok=0
          for i in 1 2 3 4; do
            if ./gradlew assembleDebug; then ok=1; break; fi
            echo "Attempt $i failed, retrying..."
            sleep 20
          done
          [ "$ok" = 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: ZenithDialer-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
